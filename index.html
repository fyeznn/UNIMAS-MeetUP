<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMAS MeetUp Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Apply Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        /* Custom scrollbar for better mobile feel */
        .scrollable-content::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .app-screen {
            min-height: 100vh;
        }
        .btn-primary {
            /* Tailwind classes combined here */
            @apply bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:bg-blue-700 transition duration-150;
        }
    </style>
</head>
<body>

<div id="app" class="max-w-md mx-auto bg-white shadow-2xl app-screen relative">
    </div>

<div id="modal-container" onclick="handleModalClick(event)" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 transition-opacity duration-300">
    <div id="modal-content" class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm relative transform transition duration-300 ease-out scale-95 opacity-0">
        </div>
</div>

<script>
    // --- Global Data and State ---
    let currentView = 'landing'; // 'landing', 'student_dashboard', 'lecturer_dashboard'
    let userRole = null; // 'student', 'lecturer'
    let selectedLecturer = null;
    let selectedSlot = null;
    let isModalOpen = false;
    let selectedFaculty = 'All'; // State for faculty filtering
    let reschedulingAppointmentId = null; // To track the appointment being rescheduled
    let selectedAppointmentMonthFilter = 'All'; // NEW STATE: For month filtering on lecturer appointment list
    const monthAbbreviations = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];


    // Simulated student data (with contact info)
    const students = [
        { id: '103921', name: 'Eizzan Arrfyzam', email: '103921@student.unimas.my', phone: '011-1234 5678' },
        { id: '86178', name: 'Nurul Maliyanah', email: '86178@student.unimas.my', phone: '013-9876 5432' },
        { id: '103129', name: 'Ahmed Syazwi', email: '103129@student.unimas.my', phone: '017-5555 1234' },
        { id: '86881', name: 'Nurul Aisyatul', email: '86881@student.unimas.my', phone: '019-1111 2222' },
    ];

    // Updated Simulated Faculty Data
    const faculties = ['FCSIT', 'FEB', 'FACA', 'FENG'];
    const loggedInLecturerId = 1; // Assuming Lecturer Dr. Wan Norizan (ID 1) is logged in.
    
    const lecturers = [
        { id: 1, name: 'Dr. Wan Norizan', faculty: 'FCSIT', title: 'Deputy Dean', photo: 'https://directory.unimas.my/assets/images/staffpic/681.jpg' },
        { id: 2, name: 'Assoc. Prof. Dr. Mohd Shahidan', faculty: 'FEB', title: 'Academic Advisor', photo: 'https://directory.unimas.my/assets/images/staffpic/3157.jpg' },
        { id: 3, name: 'Dr. Faridah Sahari', faculty: 'FACA', title: 'Senior Lecturer', photo: 'https://directory.unimas.my/assets/images/staffpic/2083.jpg' },
        { id: 4, name: 'Dr. Dyg Norkhairunnisa', faculty: 'FENG', title: 'Senior Lecturer', photo: 'https://directory.unimas.my/assets/images/staffpic/2710.jpg' },
        { id: 5, name: 'Puan Halimah B.', faculty: 'FCSIT', title: 'Lecturer', photo: 'https://placehold.co/100x100/e9a2b7/ffffff?text=HB' },
    ];

    const availability = {
        1: [ // Slots for Dr. Wan Norizan(ID 1). Note: s1, s3, s8 are booked
            { id: 's2', day: 'Wed, Oct 25', time: '11:00 AM', type: 'In-person' },
            { id: 's9', day: 'Tue, Nov 7', time: '10:00 AM', type: 'In-person' }, 
        ],
        2: [ // s4 is booked/pending
            { id: 's5', day: 'Fri, Oct 27', time: '10:30 AM', type: 'Zoom' },
        ],
        3: [],
        4: [
            { id: 's6', day: 'Mon, Oct 30', time: '03:00 PM', type: 'In-person' },
        ],
        5: [
            { id: 's7', day: 'Tue, Oct 31', time: '09:00 AM', type: 'Zoom' },
        ]
    };

    let appointments = [
        // OCT APPOINTMENTS
        { id: 'a1', lecturerId: 1, lecturerName: 'Dr. Wan Norizan', day: 'Wed, Oct 25', time: '10:00 AM', student: 'Eizzan Arrfyzam (103921)', studentId: '103921', type: 'Zoom', purpose: 'Discussing final year project proposal.', status: 'Booked', slotId: 's1', notification: null }, 
        { id: 'a2', lecturerId: 1, lecturerName: 'Dr. Wan Norizan', day: 'Thu, Oct 26', time: '02:00 PM', student: 'Nurul Maliyanah (86178)', studentId: '86178', type: 'Phone', purpose: 'Seeking advice on course selection.', status: 'Booked', slotId: 's3', notification: null }, 
        { id: 'a3', lecturerId: 2, lecturerName: 'Assoc. Prof. Dr. Mohd Shahidan', day: 'Fri, Oct 27', time: '09:30 AM', student: 'Ahmed Syazwi (103129)', studentId: '103129', type: 'In-person', purpose: 'Reviewing assignment 1 feedback.', status: 'Pending', slotId: 's4', notification: null }, 
        // NOV APPOINTMENT (NEW: Demonstrates filter functionality)
        { id: 'a4', lecturerId: 1, lecturerName: 'Dr. Wan Norizan', day: 'Tue, Nov 7', time: '09:00 AM', student: 'Nurul Aisyatul (86881)', studentId: '86881', type: 'Zoom', purpose: 'Final check of research proposal.', status: 'Booked', slotId: 's8', notification: null },
    ];
    
    // Hardcoded current student for simulation
    const currentStudent = students.find(s => s.id === '103921');

    // --- DOM Elements ---
    const app = document.getElementById('app');
    const modalContainer = document.getElementById('modal-container');
    const modalContent = document.getElementById('modal-content');

    // --- Utility Functions ---

    /** * Renders the standard Lucide icon markup (i tag with data-lucide attribute). 
     * Lucide's createIcons() function must be called after insertion to convert this to an SVG.
     */
    const getIcon = (name, className = 'w-5 h-5') => {
        return `<i data-lucide="${name}" class="${className}"></i>`;
    };


    /** Opens and populates the modal */
    const openModal = (htmlContent) => {
        modalContent.innerHTML = htmlContent;
        modalContainer.classList.remove('hidden');
        // Animate in
        setTimeout(() => {
            modalContent.classList.remove('scale-95', 'opacity-0');
            modalContent.classList.add('scale-100', 'opacity-100');
            // IMPORTANT: Render icons inside the newly opened modal
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }, 10);
        isModalOpen = true;
    };

    /** Closes the modal */
    const closeModal = () => {
        // Animate out
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modalContainer.classList.add('hidden');
            modalContent.innerHTML = '';
        }, 300);
        isModalOpen = false;
        selectedLecturer = null;
        selectedSlot = null;
        reschedulingAppointmentId = null; // Reset reschedule state
    };
    
    /** Handle click outside the modal content to close it */
    const handleModalClick = (e) => {
        if (e.target.id === 'modal-container') {
            closeModal();
        }
    };

    /** Handles non-blocking error display inside the modal */
    const showModalError = (message) => {
        let errorElement = modalContent.querySelector('#modal-error');
        if (!errorElement) {
             errorElement = document.createElement('p');
             errorElement.id = 'modal-error';
             errorElement.className = 'text-red-600 text-sm mt-2 font-semibold text-center';
             // Find a sensible place to insert the error, typically before the main action button
             const button = modalContent.querySelector('button[onclick*="submit"], button[onclick*="confirm"]');
             if (button) {
                button.before(errorElement);
             } else {
                modalContent.appendChild(errorElement);
             }
        }
        errorElement.textContent = message;
        
        setTimeout(() => {
            if (errorElement) errorElement.textContent = '';
        }, 3000);
    };


    // --- Renderer Functions ---

    const renderHeader = (title) => {
        const lecturerInfo = lecturers.find(l => l.id === loggedInLecturerId);
        const userDisplay = userRole === 'student' ? 
            `${currentStudent.name} (${currentStudent.id})` : 
            `${lecturerInfo ? lecturerInfo.name : 'Lecturer'} (Staff ID: WN987)`;
            
        return `
            <header class="p-5 bg-white shadow-sm sticky top-0 z-40">
                <h1 class="text-2xl font-extrabold text-blue-800">${title}</h1>
                <p class="text-xs text-gray-500 mt-1">Logged in as: ${userDisplay}</p>
            </header>
        `;
    }

    const renderNavBar = (role) => {
        const studentNav = `
            <button onclick="setView('student_dashboard')" class="flex-1 flex flex-col items-center justify-center p-2 ${currentView === 'student_dashboard' && !currentView.includes('appointment') ? 'text-blue-600' : 'text-gray-500 hover:text-blue-600'}">
                ${getIcon('calendar-check', 'w-6 h-6')}
                <span class="text-xs mt-1 font-medium">Book</span>
            </button>
            <button onclick="renderStudentAppointments()" class="flex-1 flex flex-col items-center justify-center p-2 ${currentView === 'student_appointments' ? 'text-blue-600' : 'text-gray-500 hover:text-blue-600'}">
                ${getIcon('list-checks', 'w-6 h-6')}
                <span class="text-xs mt-1 font-medium">My Meetings</span>
            </button>
        `;
        const lecturerNav = `
            <button onclick="renderLecturerAvailability()" class="flex-1 flex flex-col items-center justify-center p-2 ${currentView === 'lecturer_dashboard' ? 'text-blue-600' : 'text-gray-500 hover:text-blue-600'}">
                ${getIcon('calendar-plus', 'w-6 h-6')}
                <span class="text-xs mt-1 font-medium">Set Slots</span>
            </button>
            <button onclick="renderLecturerAppointments()" class="flex-1 flex flex-col items-center justify-center p-2 ${currentView === 'lecturer_appointments' ? 'text-blue-600' : 'text-gray-500 hover:text-blue-600'}">
                ${getIcon('users', 'w-6 h-6')}
                <span class="text-xs mt-1 font-medium">Appointments</span>
            </button>
        `;

        return `
            <footer class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-white border-t border-gray-200 z-50 rounded-t-xl shadow-2xl">
                <div class="flex justify-around items-center h-16">
                    ${role === 'student' ? studentNav : lecturerNav}
                    <button onclick="logout()" class="flex-1 flex flex-col items-center justify-center p-2 text-red-500 hover:text-red-700">
                        ${getIcon('log-out', 'w-6 h-6')}
                        <span class="text-xs mt-1 font-medium">Logout</span>
                    </button>
                </div>
            </footer>
        `;
    };

    // --- Landing Screen (Login Selection) ---
    const renderLanding = () => {
        // UNIMAS Logo URL provided by user
        const unimasLogoUrl = 'https://th.bing.com/th/id/R.93660cc5499f57181c881496ef4f3b0a?rik=SfmplhIetgsLQw&riu=http%3a%2f%2f1.bp.blogspot.com%2f-zYtaqE9LvBg%2fTYJUjR3vHSI%2fAAAAAAAAE-w%2fqdXkstWMDwU%2fs1600%2fUniversiti%252BMalaysia%252BSarawak%252B%252528UNIMAS%252529.png&ehk=aawJGgUL2eJXZaejeYPbUW6unTo6bzEKTVA0j%2be4sDY%3d&risl=&pid=ImgRaw&r=0';

        app.innerHTML = `
            <div class="flex flex-col items-center justify-center min-h-screen p-8 text-center bg-gradient-to-br from-blue-100 to-indigo-200">
                <img src="${unimasLogoUrl}" alt="UNIMAS Logo" class="w-20 h-20 mb-4 object-contain">
                <h2 class="text-4xl font-extrabold text-blue-800 mb-2">UNIMAS MeetUp</h2>
                <p class="text-gray-600 mb-8">Smart Scheduling for Academic Success.</p>
                
                <div id="login-form-card" class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm space-y-5">
                    
                    <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">Secure Sign In</h3>

                    <div>
                        <label for="user-id" class="block text-left text-sm font-medium text-gray-700">Student ID / Staff ID</label>
                        <input type="text" id="user-id" value="WN987" placeholder="e.g., 103921 or WN987" class="mt-1 w-full p-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>

                    <div>
                        <label for="password" class="block text-left text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" value="password" placeholder="••••••••" class="mt-1 w-full p-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                    
                    <div>
                        <label class="block text-left text-sm font-medium text-gray-700 mb-2">Select Role</label>
                        <div class="flex justify-between space-x-3">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="role" value="student" id="role-student" class="hidden peer">
                                <div class="p-3 text-center border-2 border-gray-300 rounded-xl transition hover:border-blue-500 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-600 shadow-sm">
                                    ${getIcon('user', 'w-5 h-5 mx-auto mb-1')}
                                    <span class="text-sm font-semibold">Student</span>
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="role" value="lecturer" id="role-lecturer" class="hidden peer" checked>
                                <div class="p-3 text-center border-2 border-gray-300 rounded-xl transition hover:border-indigo-500 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 shadow-sm">
                                    ${getIcon('briefcase', 'w-5 h-5 mx-auto mb-1')}
                                    <span class="text-sm font-semibold">Lecturer</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <p id="login-error" class="text-red-600 text-sm hidden"></p>

                    <button onclick="handleLogin()" class="btn-primary w-full mt-4 bg-blue-600 hover:bg-blue-700 flex items-center justify-center">
                        ${getIcon('log-in', 'w-5 h-5 mr-2')}
                        Sign In
                    </button>
                    <p class="text-xs text-gray-400 mt-4 text-center">Student: 103921/password | Lecturer: WN987/password</p>
                    
                </div>
            </div>
        `;
        // IMPORTANT FIX: Call createIcons immediately after rendering new HTML content
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
        }
    };

    /** Handles the dummy login form submission */
    window.handleLogin = () => {
        const userId = document.getElementById('user-id')?.value.trim();
        const password = document.getElementById('password')?.value.trim();
        const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
        const errorElement = document.getElementById('login-error');
        
        errorElement.classList.add('hidden'); // Reset error state

        if (!userId || !password || !selectedRole) {
            errorElement.textContent = 'Please enter both ID and Password, and select your role.';
            errorElement.classList.remove('hidden');
            return;
        }

        // --- Dummy Authentication Logic ---
        let loginSuccess = false;
        let errorMessage = '';

        if (selectedRole === 'student') {
            if (userId === '103921' && password === 'password') {
                loginSuccess = true;
            } else {
                errorMessage = 'Invalid Student ID or Password.';
            }
        } else if (selectedRole === 'lecturer') {
            if (userId === 'WN987' && password === 'password') {
                loginSuccess = true;
            } else {
                errorMessage = 'Invalid Staff ID or Password.';
            }
        }

        if (loginSuccess) {
            login(selectedRole); 
        } else {
            errorElement.textContent = errorMessage || 'Login failed. Please check your credentials.';
            errorElement.classList.remove('hidden');
        }
    };

    // --- Student View Functions ---
    
    // New function to handle faculty filtering
    window.filterLecturers = (faculty) => {
        selectedFaculty = faculty;
        renderLecturerList(); // Re-render the list with the new filter
    };

    window.renderLecturerList = () => {
        currentView = 'student_dashboard';
        
        // Apply filtering logic
        const filteredLecturers = selectedFaculty === 'All' 
            ? lecturers
            : lecturers.filter(l => l.faculty === selectedFaculty);
        
        const listHtml = filteredLecturers.map(l => {
            const hasSlots = availability[l.id] && availability[l.id].length > 0;
            return `
                <div class="flex items-center p-4 bg-white rounded-xl shadow-md mb-3 border-l-4 ${hasSlots ? 'border-green-500' : 'border-gray-300'}">
                    <img src="${l.photo}" alt="${l.name}" class="w-12 h-12 rounded-full object-cover mr-4">
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800">${l.name}</h3>
                        <p class="text-sm text-gray-500">${l.title} - ${l.faculty}</p>
                    </div>
                    <button onclick="viewLecturerSlots(${l.id})" class="bg-blue-500 text-white text-xs font-semibold py-2 px-4 rounded-full hover:bg-blue-600 transition">
                        ${hasSlots ? 'Book' : 'No Slots'}
                    </button>
                </div>
            `;
        }).join('') || `<p class="text-center text-gray-500 p-8 bg-gray-50 rounded-xl mt-4">No lecturers found in ${selectedFaculty}.</p>`;

        app.innerHTML = `
            ${renderHeader('Book a MeetUp')}
            <div class="p-5 pb-20 scrollable-content">
                <div class="mb-4 relative">
                    <input type="text" placeholder="Search lecturer by name or course..." class="w-full p-3 pl-10 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500">
                    <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                        ${getIcon('search', 'w-5 h-5')}
                    </span>
                </div>
                <div class="flex space-x-2 overflow-x-auto pb-4 hide-scrollbar">
                    ${['All', ...faculties].map(f => `
                        <button onclick="filterLecturers('${f}')" class="flex-shrink-0 text-sm py-2 px-4 rounded-full ${f === selectedFaculty ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                            ${f}
                        </button>
                    `).join('')}
                </div>
                <h2 class="text-xl font-bold text-gray-800 my-4">Available Lecturers</h2>
                ${listHtml}
            </div>
            ${renderNavBar('student')}
        `;
        // IMPORTANT FIX: Call createIcons immediately after rendering new HTML content
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
        }
    };

    window.viewLecturerSlots = (lecturerId, isReschedule = false) => {
        const lecturer = lecturers.find(l => l.id === lecturerId);
        if (!lecturer) return;
        selectedLecturer = lecturer;
        
        let slots = availability[lecturerId] || [];
        
        // Slot action changes based on whether we are rescheduling or making a new booking
        const slotAction = (slot) => isReschedule ? `selectNewSlotForReschedule('${reschedulingAppointmentId}', '${lecturer.name}', '${lecturerId}', '${slot.day}', '${slot.time}', '${slot.type}', '${slot.id}')` : 
                                         `openBookingModal('${slot.day}', '${slot.time}', '${slot.type}', ${selectedLecturer.id}, '${slot.id}')`;

        const slotHtml = slots.length > 0 ? slots.map(slot => `
            <div onclick="${slotAction(slot)}" 
                 class="p-4 border border-gray-200 rounded-xl mb-3 flex justify-between items-center bg-green-50 hover:bg-green-100 cursor-pointer transition">
                <div>
                    <p class="font-bold text-green-700">${slot.day}</p>
                    <p class="text-lg font-extrabold text-gray-800">${slot.time}</p>
                </div>
                <span class="text-sm bg-blue-100 text-blue-600 px-3 py-1 rounded-full">${slot.type}</span>
            </div>
        `).join('') : '<p class="text-center text-gray-500 p-8 bg-gray-50 rounded-xl">No available slots set for this lecturer.</p>';

        const content = `
            <h3 class="text-2xl font-bold ${isReschedule ? 'text-yellow-600' : 'text-blue-800'} mb-2">${isReschedule ? 'Select New Time Slot' : lecturer.name}</h3>
            <p class="text-gray-500 mb-4">${lecturer.title} - ${lecturer.faculty}</p>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700">
                ${getIcon('x', 'w-6 h-6')}
            </button>
            <h4 class="text-xl font-semibold mt-4 mb-3">Available Time Slots</h4>
            <div class="max-h-80 overflow-y-auto pr-2">
                ${slotHtml}
            </div>
        `;
        openModal(content); // openModal will call createIcons
    };

    window.openBookingModal = (day, time, type, lecturerId, slotId) => {
        const lecturer = lecturers.find(l => l.id === lecturerId);
        if (!lecturer) return;
        selectedLecturer = lecturer;
        selectedSlot = { day, time, type, lecturerName: lecturer.name, slotId: slotId }; // Capture slotId

        const content = `
            <h3 class="xl font-bold text-blue-800 mb-4">Confirm Appointment</h3>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700">
                ${getIcon('x', 'w-6 h-6')}
            </button>
            <div class="space-y-3 p-4 bg-gray-50 rounded-xl mb-4 border border-gray-200">
                <p class="font-semibold text-gray-700">Lecturer: <span class="text-blue-600">${lecturer.name}</span></p>
                <p class="font-semibold text-gray-700">Time: <span class="text-green-600">${day} at ${time}</span></p>
                <p class="font-semibold text-gray-700">Type: <span class="bg-blue-100 text-blue-600 px-3 py-0.5 text-sm rounded-full">${type}</span></p>
            </div>

            <label class="block text-sm font-medium text-gray-700 mt-4">Meeting Purpose (Notes Section)</label>
            <textarea id="purpose-notes" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 mt-1" placeholder="e.g., Discussing FYP draft, need advice on career path..."></textarea>

            <button onclick="submitBooking()" class="btn-primary w-full mt-6 flex items-center justify-center">
                ${getIcon('check-circle', 'w-5 h-5 mr-2')}
                Confirm Booking
            </button>
        `;
        openModal(content); // openModal will call createIcons
    };

    window.submitBooking = () => {
        const notes = document.getElementById('purpose-notes').value || 'No specific purpose provided.';
        const newAppointment = {
            id: 'a' + (appointments.length + 1),
            lecturerId: selectedLecturer.id,
            lecturerName: selectedLecturer.name,
            day: selectedSlot.day,
            time: selectedSlot.time,
            student: `${currentStudent.name} (${currentStudent.id})`,
            studentId: currentStudent.id, // Include student ID
            type: selectedSlot.type,
            purpose: notes,
            status: 'Booked',
            slotId: selectedSlot.slotId, 
            notification: null, // New booking, no notification needed
        };
        appointments.push(newAppointment);

        // Remove the booked slot from availability (simulated)
        const lecturerAvailability = availability[selectedLecturer.id];
        const slotIndex = lecturerAvailability.findIndex(s => s.id === selectedSlot.slotId); // Use slotId for removal
        if (slotIndex > -1) {
            lecturerAvailability.splice(slotIndex, 1);
        }

        closeModal();
        renderStudentAppointments('Booking Confirmed!', 'Your appointment has been successfully booked. You will receive an email reminder 24 hours prior.');
    };
    
    window.renderStudentAppointments = (alertTitle = null, alertMessage = null) => {
        currentView = 'student_appointments';
        const studentMeetings = appointments.filter(a => a.studentId === currentStudent.id);

        const listHtml = studentMeetings.map(a => {
            
            // Reschedule Notification logic
            const notificationHtml = a.notification ? `

    window.showRescheduleCancelModal = (id, action) => {

            <div class="space-y-3 p-4 bg-gray-50 rounded-xl mb-6 border border-gray-200">
                <p class="font-semibold text-gray-700">Lecturer: <span class="text-blue-600">${appointment.lecturerName}</span></p>

            </div>

            </button>
            <button onclick="closeModal()" class="w-full mt-2 text-gray-500 hover:text-gray-800 py-2">Keep Appointment</button>
        `;
        openModal(content); // openModal will call createIcons

    window.cancelAppointment = (id) => {
        // Find and remove the appointment (simulated)
        const appointment = appointments.find(a => a.id === id);
        if (!appointment) return;

        // Return the slot to availability
        if (appointment.slotId) {
            const lecturerAvailability = availability[appointment.lecturerId];
            if (lecturerAvailability) {
                if (!lecturerAvailability.find(s => s.id === appointment.slotId)) {
                    // Re-add the original slot details
                    lecturerAvailability.push({ 
                        id: appointment.slotId, 
                        day: appointment.day, 
                        time: appointment.time, 
                        type: appointment.type 
                    });
                }
            }
        }

        const index = appointments.findIndex(a => a.id === id);
        if (index > -1) {
            appointments.splice(index, 1);
        }
        closeModal();
        renderStudentAppointments('Appointment Cancelled!', 'The appointment has been successfully cancelled. The lecturer has been notified.');

    // --- RESCHEDULE LOGIC (Shared by Student and Lecturer) ---

    window.openRescheduleModal = (appointmentId) => {

        if (!appointment) {
            closeModal();
            alert('Error: Appointment not found.');
            return;
        }

        const lecturer = lecturers.find(l => l.id === appointment.lecturerId);
        if (!lecturer) {
            closeModal();
            alert('Error: Lecturer not found.');
            return;
        }

        // --- MODIFICATION: Lecturer gets the manual input modal, Student gets the slot picker ---
        if (userRole === 'lecturer') {
            openManualRescheduleModal(appointment);
        } else {
            // Student flow remains selecting from available slots
            viewLecturerSlots(appointment.lecturerId, true); 
        }
        // --- END MODIFICATION ---
    };

    /**
     * NEW FUNCTION: Opens the modal for the lecturer to manually input new date/time/type.
     */
    window.openManualRescheduleModal = (appointment) => {
        // Parse current date/time to fill input defaults
        // E.g., 'Wed, Oct 25' needs to be converted to a full date string like '2025-10-25'
        // This is complex and relies on assumption, so for prototype, we'll try to guess/default or ask for full input.
        
        // A simple way to get a date string from 'Day, Mon D' is to try and construct a Date object
        const parts = appointment.day.split(', ')[1].split(' '); // e.g., ['Oct', '25']
        const monthIndex = monthAbbreviations.findIndex(m => m === parts[0]);
        // Assume current year for simplicity in prototype, this is a real-world edge case.
        const currentYear = new Date().getFullYear(); 
        const dateString = `${currentYear}-${(monthIndex + 1).toString().padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
        
        // Convert 12hr time to 24hr for time input
        const time12hr = appointment.time; // e.g., '10:00 AM'
        const [time, modifier] = time12hr.split(' ');
        let [hours, minutes] = time.split(':');
        if (hours === '12') {
            hours = '00';
        }
        if (modifier === 'PM') {
            hours = parseInt(hours, 10) + 12;
        }
        const time24hr = `${hours.toString().padStart(2, '0')}:${minutes}`;

        const content = `
            <h3 class="text-2xl font-bold text-yellow-600 mb-2">Manual Reschedule</h3>
            <p class="text-gray-500 mb-4">For: <span class="font-semibold">${appointment.student}</span></p>

                <label class="block text-sm font-medium text-gray-700">New Meeting Type</label>
                <select id="new-slot-type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="In-person" ${appointment.type === 'In-person' ? 'selected' : ''}>In-person (Office)</option>
                    <option value="Zoom" ${appointment.type === 'Zoom' ? 'selected' : ''}>Online (Zoom/Meet)</option>
                    <option value="Phone" ${appointment.type === 'Phone' ? 'selected' : ''}>Phone Call</option>
                </select>
            </div>
            <div id="modal-error"></div>

            <button onclick="submitManualReschedule('${appointment.id}')" class="w-full font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-150 bg-yellow-600 hover:bg-yellow-700 text-white mt-6 flex items-center justify-center">
                ${getIcon('save', 'w-5 h-5 mr-2')}
                Confirm Manual Reschedule
            </button>
        `;
        openModal(content);
    };

    /**
     * NEW FUNCTION: Handles the submission of the manual reschedule form (Lecturer side).
     */
    window.submitManualReschedule = (appointmentId) => {
        const dateInput = document.getElementById('new-slot-date').value;
        const timeInput = document.getElementById('new-slot-time').value;
        const typeInput = document.getElementById('new-slot-type').value;

        if (!dateInput || !timeInput || !typeInput) {
            showModalError("Please fill in all fields for the new time and type.");
            return;
        }

        const date = new Date(dateInput);
        const newDay = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        const newTime = new Date('2000/01/01 ' + timeInput).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        // IMPORTANT: The lecturer is manually setting this time, so no pre-existing slot is involved.
        // We pass a dummy/null slotId and let selectNewSlotForReschedule handle the logic.
        selectNewSlotForReschedule(appointmentId, '', loggedInLecturerId, newDay, newTime, typeInput, null); 
    };
    
    // Shared function to perform the actual reschedule logic
    window.selectNewSlotForReschedule = (appointmentId, lecturerName, lecturerId, newDay, newTime, newType, newSlotId) => {
        const currentAppointment = appointments.find(a => a.id === appointmentId);
        if (!currentAppointment) {
            showModalError('Error: Rescheduling failed. Original appointment not found.');
            return;
        }

        // 1. Get Old Slot Details to return to availability
        const oldSlotId = currentAppointment.slotId;
        const oldDay = currentAppointment.day;
        const oldTime = currentAppointment.time;
        const oldType = currentAppointment.type;

        // 2. Perform the Update
        currentAppointment.day = newDay;
        currentAppointment.time = newTime;
        currentAppointment.type = newType;
        // If the update came from a slot selection (student flow), use the newSlotId. Otherwise, set to null (lecturer flow).
        currentAppointment.slotId = newSlotId; 
        
        // Set notification if lecturer is the one rescheduling
        if (userRole === 'lecturer') {
            currentAppointment.notification = 'Rescheduled by Lecturer: Please check the new time.';
        } else {
            // Clear notification if student is rescheduling (they are initiating it)
            currentAppointment.notification = null;
        }

        // 3. Update Availability: Return Old Slot (ONLY if the old slot exists and isn't already re-added)
        // This step is crucial only if an old slot was *actually* booked.
        if (oldSlotId) {
            const lecturerAvailability = availability[lecturerId];
            if (lecturerAvailability) {
                if (!lecturerAvailability.find(s => s.id === oldSlotId)) {
                    // Re-add the original slot details
                    lecturerAvailability.push({ 
                        id: oldSlotId, 
                        day: oldDay, 
                        time: oldTime, 
                        type: oldType 
                    });
                }
            }
        }
        
        // 4. Update Availability: Consume New Slot
        // Only consume the new slot if a newSlotId was provided (Student flow)
        if (newSlotId) {
            const lecturerAvailability = availability[lecturerId];
            const newSlotIndex = lecturerAvailability.findIndex(s => s.id === newSlotId);
            if (newSlotIndex > -1) {
                lecturerAvailability.splice(newSlotIndex, 1);
            }
        }
        // NOTE: For the manual lecturer reschedule, no slot is consumed as it may not be in the 'availability' list.

        closeModal();
        
        const successMessage = `The meeting with ${currentAppointment.student} has been successfully rescheduled to ${newDay} at ${newTime}.`;
        
        // Re-render the correct view after reschedule
        if (userRole === 'student') {
            renderStudentAppointments('Reschedule Successful!', successMessage);
        } else if (userRole === 'lecturer') {
            renderLecturerAppointments('Reschedule Successful!', successMessage);
        }
    };


    // --- Lecturer View Functions ---

    window.filterLecturerAppointmentsByMonth = (monthAbbr) => {

    };

    window.viewContactStudentModal = (studentId) => {

        const content = `

                            ${getIcon('phone-call', 'w-5 h-5')}
                        </a>
                    </div>
                </div>
            </div>
            <button onclick="closeModal()" class="btn-primary w-full mt-4 bg-blue-600 hover:bg-blue-700">
                Done
            </button>
        `;
        openModal(content);
    };

    window.renderLecturerAppointments = (alertTitle = null, alertMessage = null) => {
        currentView = 'lecturer_appointments';

        const lecturerMeetings = appointments.filter(a => a.lecturerId === loggedInLecturerId);

        const filteredMeetings = lecturerMeetings.filter(a => {

            // The 'day' is formatted as 'Wed, Oct 25'. Extract the month abbreviation (e.g., 'Oct')
            const monthAbbreviation = a.day.split(', ')[1].split(' ')[0]; 
            return monthAbbreviation === selectedAppointmentMonthFilter;
        });
        // --- END Filtering Logic ---


        const listHtml = filteredMeetings.map(a => `
            <div onclick="viewAppointmentDetails('${a.id}')" class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 ${a.status === 'Booked' ? 'border-blue-500' : (a.status === 'Completed' ? 'border-purple-500' : 'border-orange-500')} cursor-pointer hover:bg-gray-50 transition">

        const alertHtml = alertTitle ? `

                                ${month} ${!hasAppointments ? ' (No meetings)' : ''}

                        `;

        `;
        // --- END Dropdown HTML ---

        app.innerHTML = `

        `;
        // IMPORTANT FIX: Call createIcons immediately after rendering new HTML content
        if (typeof lucide !== 'undefined' && lucide.createIcons) {

    };

    // Function to view appointment details (Lecturer side)

        const isCompleted = appointment.status === 'Completed';

        const content = `

            <div class="space-y-3 p-4 bg-gray-50 rounded-xl mb-4 border border-gray-200">
                <p class="font-semibold text-gray-700">Student: <span class="text-gray-800">${appointment.student}</span></p>
                <p class="font-semibold text-gray-700">Time: <span class="text-green-600">${appointment.day} at ${appointment.time}</span></p>
                <p class="font-semibold text-gray-700">Type: <span class="bg-blue-100 text-blue-600 px-2 py-0.5 text-sm rounded-full">${appointment.type}</span></p>

            <h4 class="text-md font-semibold mt-4 mb-2 text-gray-700">Purpose (Student Notes)</h4>
            <div class="p-3 bg-white border border-gray-300 rounded-lg text-sm text-gray-800 mb-6">
                ${appointment.purpose}
            </div>
            
            <button onclick="openRescheduleModal('${appointment.id}')" class="w-full font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-150 bg-yellow-500 hover:bg-yellow-600 text-white mb-3 flex items-center justify-center">
                ${getIcon('refresh-cw', 'w-5 h-5 mr-2')}

            </button>

            <button ${isCompleted ? 'disabled' : ''} onclick="markAppointmentAsCompleted('${appointment.id}')" class="w-full font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-150 text-white mb-3 flex items-center justify-center ${completedBtnClass}">
                ${getIcon('check-circle', 'w-5 h-5 mr-2')}

            </button>

            <button onclick="viewContactStudentModal('${appointment.studentId}')" class="btn-primary w-full bg-green-600 hover:bg-green-700 flex items-center justify-center">
                ${getIcon('phone', 'w-5 h-5 mr-2')}
                Contact Student
            </button>
        `;
        openModal(content); // openModal will call createIcons
    };

        const alertHtml = alertTitle ? `
            <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-xl mb-5" role="alert">
                <p class="font-bold">${alertTitle}</p>
                <p class="text-sm">${alertMessage}</p>
            </div>
        ` : '';

        app.innerHTML = `
            ${renderHeader('Set Your Availability')}
            <div class="p-5 pb-20 scrollable-content">
                ${alertHtml}
                <button onclick="openSetAvailabilityModal()" class="btn-primary w-full mb-6 flex items-center justify-center">
                    ${getIcon('calendar-plus', 'w-5 h-5 mr-2')}
                    Add New Availability Slot
                </button>

                <h2 class="text-xl font-bold text-gray-800 mb-4">Current Open Slots</h2>
                ${listHtml}
            </div>
            ${renderNavBar('lecturer')}
        `;
        // IMPORTANT FIX: Call createIcons immediately after rendering new HTML content
        if (typeof lucide !== 'undefined' && lucide.createIcons) {
            lucide.createIcons();
        }
    };

    window.openSetAvailabilityModal = () => {
        const content = `
            <h3 class="text-2xl font-bold text-blue-800 mb-4">Set New Slot</h3>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700">
                ${getIcon('x', 'w-6 h-6')}
            </button>
            <div class="space-y-4">
                <label class="block text-sm font-medium text-gray-700">Date</label>
                <input type="date" id="slot-date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <label class="block text-sm font-medium text-gray-700">Time</label>
                <input type="time" id="slot-time" value="14:00" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <label class="block text-sm font-medium text-gray-700">Meeting Type</label>
                <select id="slot-type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="In-person">In-person (Office)</option>
                    <option value="Zoom">Online (Zoom/Meet)</option>
                    <option value="Phone">Phone Call</option>
                </select>
            </div>
            <div id="modal-error"></div>
            <button onclick="submitNewSlot()" class="btn-primary w-full mt-6 flex items-center justify-center">
                ${getIcon('save', 'w-5 h-5 mr-2')}
                Publish Slot
            </button>
        `;
        openModal(content); // openModal will call createIcons
    };

    window.submitNewSlot = () => {
        const dateInput = document.getElementById('slot-date').value;
        const time = document.getElementById('slot-time').value;
        const type = document.getElementById('slot-type').value;

        if (!dateInput || !time || !type) {
            showModalError("Please fill in all fields to publish the slot.");
            return;
        }

        const date = new Date(dateInput);
        const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        // Use a safer way to parse time in case of browser inconsistencies
        const time12hr = new Date('2000/01/01 ' + time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        const newSlot = {
            id: 's' + Date.now(),
            day: day,
            time: time12hr,
            type: type
        };

        // Add to the lecturer's slots
        if (!availability[loggedInLecturerId]) availability[loggedInLecturerId] = [];
        availability[loggedInLecturerId].push(newSlot);

        closeModal();
        renderLecturerAvailability('Slot Added!', 'The new slot has been successfully published for students to book.');
    };

    window.removeSlot = (id) => {
        // Simulated removal
        const lecturerAvailability = availability[loggedInLecturerId];
        const index = lecturerAvailability.findIndex(s => s.id === id);
        if (index > -1) {
            lecturerAvailability.splice(index, 1);
        }
        renderLecturerAvailability('Slot Removed!', 'The availability slot has been removed.');
    };

    // --- Core Navigation and Logic ---

    window.login = (role) => {
        userRole = role;
        // Reset month filter on login for a fresh view
        selectedAppointmentMonthFilter = 'All'; 
        if (role === 'student') {
            setView('student_dashboard');
        } else if (role === 'lecturer') {
            setView('lecturer_appointments'); // Direct lecturer to appointments list first
        }
    };

    window.logout = () => {
        userRole = null;
        setView('landing');
    };

    window.setView = (viewName) => {
        currentView = viewName;
        // Reset filter when changing primary views for simplicity
        if (viewName === 'student_dashboard') {
            selectedFaculty = 'All'; 
            renderLecturerList();
        } else if (viewName === 'landing') {
            renderLanding();
        } else if (viewName === 'lecturer_dashboard') {
            renderLecturerAvailability();
        } else if (viewName === 'student_appointments') {
            renderStudentAppointments();
        } else if (viewName === 'lecturer_appointments') {
            renderLecturerAppointments();
        }
    };

    // Start the application immediately on window load to ensure Lucide is available
    window.onload = () => {
        setView('landing');
    };
</script>

</body>
</html>
